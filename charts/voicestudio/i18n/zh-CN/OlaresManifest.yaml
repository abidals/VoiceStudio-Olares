metadata:
  title: VoiceStudio
  description: 完全本地化的开源 ElevenLabs 替代方案 — 克隆声音、视频配音、听写、转写与有声书制作，支持 646 种语言。
spec:
  fullDescription: |
    **VoiceStudio** 是开源、完全本地化的 **ElevenLabs 替代方案** — 在你自己的硬件上克隆声音、为视频配音、听写、转写、制作有声书。该图表为 Olares 封装官方无头 **Web 服务器**镜像，核心工作流不依赖任何外部服务。

    ## 工作流

    - **声音克隆** — 从几秒钟的参考片段零样本合成（3 秒可用，推荐 5–15 秒）。
    - **声音设计** — 按年龄、口音、音调、风格与语气定制声音。
    - **视频配音** — 转写、保留说话人身份的翻译、合成并导出；支持 URL 导入与 YouTube 登录。
    - **故事与有声书** — 多角色脚本、EPUB/PDF 导入、章节渲染、`.m4b` 导出。
    - **听写** — 系统级快捷键、浏览器与 OpenAI 兼容流式端点的实时转写。
    - **说话人分离与人声隔离** — Pyannote/WhisperX 说话人、Demucs 分离。
    - **批量队列** — 大批量音频/视频任务队列，逐任务进度。
    - **AI 水印** — 默认对合成语音嵌入 AudioSeal 水印并支持检测。

    ## 引擎

    内置模型目录提供 16 个 TTS 引擎与 11 个 ASR 引擎，包括默认的 **OmniVoice**（600+ 语言，支持克隆与指令）、CosyVoice 3、GPT-SoVITS、VoxCPM2、PocketTTS、Sherpa-ONNX，以及 OpenAI 兼容 ASR 引擎（可指向 Olares 的本地 AI 网关 — 在 **模型目录 → OpenAI 兼容** 填入从 *设置 → AI* 复制的地址与密钥）。

    ## 首次运行

    默认的 **OmniVoice** 模型（约 2.4 GB）**不在**镜像内。首次生成或 **模型目录 → 安装** 会下载到 Olares 跨应用共享模型缓存（`Common/huggingface`）；其他已安装的 AI 应用可复用同一份。每个引擎在首次使用时下载各自权重。

    ## GPU

    **NVIDIA 模式**下应用获得 GPU 的一个*专属切片* — 该图表通过 HAMi vGPU 配额声明 6 Gi 显存下限、上限 16 Gi。显卡仍与其他应用共享；重型引擎会在配额内自动调整内部任务池。没有 NVIDIA GPU 的设备可在安装时选择 **CPU 模式**。

    ## 隐私与安全

    - 全部运行在你的用户沙箱内：独立命名空间、uid 1000，只可写 `appData`（项目、声音、设置）与共享 `Common` 模型缓存。
    - 入口无需 Olares 登录即可访问，便于原生桌面应用同步 — 但所有 API 规则（含模型下载与设置更改）都需要你安装时设定的 **OMNIVOICE_API_KEY**。
    - 后端在上游设计上仅监听回环；无头 server-mode 门控默认启用。分析统计默认关闭。
    - 下载的模型沿用上游各自许可；OmniVoice 权重为 CC-BY-NC。

    ## 与原生应用同步

    用本机 VoiceStudio 桌面应用指向该 Olares 地址（安装卡片显示的后端 URL）并填入 API 密钥，即可远离本机在 NVIDIA 主机上完成重活。OpenAI 兼容客户端将 `base_url` 设为 `https://<入口地址>/v1` 并附 API 密钥。

    ## 系统要求

    - **NVIDIA 模式**：amd64 节点 + 驱动，显存 ≥ 4 GB（推荐 8 GB+；大型可选引擎需 12–16 GB）。
    - **CPU 模式**：空闲内存 8 GB+。
    - **磁盘**：数据下限约 10 GB；模型权重进入共享缓存（安装更多引擎时会达数十 GB）。
    - 首次启动较慢（模型下载 + 引擎预热）；长时间任务（配音、有声书渲染）不受请求超时影响 — 本图表对该应用关闭了入口代理超时。