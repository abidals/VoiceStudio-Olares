envs:
- envName: OMNIVOICE_API_KEY
  required: true
  type: password
  editable: false
  regex: ^.{12,}$
  description: Administrator API key for this VoiceStudio instance. Generate one,
    e.g. python3 -c "import secrets; print(secrets.token_urlsafe(32))". The web UI
    prompts for it once and holds only a short-lived session; native desktop apps
    use it as their saved credential.
- envName: HF_ENDPOINT
  valueFrom:
    envName: OLARES_USER_HUGGINGFACE_SERVICE
  description: Hugging Face endpoint resolved from your Olares AI settings.
- envName: HF_TOKEN
  valueFrom:
    envName: OLARES_USER_HUGGINGFACE_TOKEN
  description: Hugging Face token for gated model downloads, resolved from your Olares
    AI settings.
spec:
  versionName: 0.5.6
  featuredImage: https://raw.githubusercontent.com/debpalash/VoiceStudio/main/docs/media/0.5.0/catalogue.png
  promoteImage:
  - https://raw.githubusercontent.com/debpalash/VoiceStudio/main/docs/media/0.5.0/quick-switch.gif
  - https://raw.githubusercontent.com/debpalash/VoiceStudio/main/docs/media/0.5.0/catalogue.png
  - https://raw.githubusercontent.com/debpalash/VoiceStudio/main/docs/media/0.5.0/gallery-save.png
  fullDescription: |
    **VoiceStudio** is the open-source, fully-local **ElevenLabs alternative** — clone voices, dub videos, dictate, transcribe, and produce audiobooks on your own hardware. This chart wraps the official headless **web-server** image for Olares; nothing leaves your machine, and no external service is required for the core workflows.

    ## WORKFLOWS

    - **Voice cloning** — zero-shot synthesis from a short reference clip (3 s works; 5–15 s recommended).
    - **Voice design** — create a voice from age, accent, pitch, style, and delivery notes.
    - **Video dubbing** — transcribe, translate with speaker preservation, synthesize, and export; supports URL import and YouTube sign-in.
    - **Stories & audiobooks** — multi-voice scripts, EPUB/PDF import, chapter rendering, `.m4b` export.
    - **Dictation** — system-wide shortcut, live transcription (through the browser and OpenAI-compatible streaming endpoint).
    - **Speaker diarization & vocal isolation** — Pyannote/WhisperX speakers, Demucs separation.
    - **Batch queue** — queue large audio/video job sets with per-job progress.
    - **AI watermarking** — AudioSeal embedding and detection, on by default for synthetic speech.

    ## ENGINES

    16 TTS engines and 11 ASR engines are available through the built-in Model Catalogue, including the default **OmniVoice** (600+ languages, cloning + instruct), CosyVoice 3, GPT-SoVITS, VoxCPM2, PocketTTS, Sherpa-ONNX, MLX alternatives, WhisperX, Faster-Whisper, Moonshine, Parakeet, and the OpenAI-compatible ASR engine (which can point at Olares' local AI gateway — set the base URL and key in **Model Catalogue → OpenAI-compatible**, copied from your *Settings → AI* values).

    ## FIRST RUN

    The default **OmniVoice** model (~2.4 GB) is **not** bundled. The first generation or **Model Catalogue → install** action downloads it into Olares' cross-app shared model cache (`Common/huggingface`); other installed AI apps reuse the same copy. Each engine downloads its own weights on first use.

    ## GPU

    With **NVIDIA mode** the app receives a *dedicated slice* of the GPU — this chart claims a 6 Gi memory floor capped at 16 Gi of VRAM (via HAMi vGPU quota). The card stays shared with other apps; heavy engines scale their internal job pool to fit what was reserved. Choose **CPU mode** at install time on machines without NVIDIA GPUs; CPU runs the low-footprint engine family (PocketTTS / Sherpa-ONNX / KittenTTS + Faster-Whisper int8).

    ## PRIVACY & SECURITY

    - Everything runs in your user's sandbox: isolated namespace, uid 1000, only `appData` (projects, voices, settings) and the shared `Common` model cache are writable.
    - The entrance is reachable without an Olares login so native desktop apps can sync — but every API rule (including model downloads and settings changes) requires your instance's **OMNIVOICE_API_KEY**, set only you know at install time.
    - Loopback-only backend by upstream design; the headless server-mode gate ships enabled. Analytics is off by default.
    - Downloaded models keep their upstream licenses (see LICENSE-NOTICE in the upstream repo); the OmniVoice weights are CC-BY-NC.

    ## SYNC WITH NATIVE APPS

    Point the native VoiceStudio/Electron app (or the Tauri 0.5.x build) on your Mac/PC at this Olares address:

    - Backend URL: `https://<your-entrance-host>` (the URL shown on the install card)
    - API key: the value you set at install time

    The desktop app gains its full local workflow while heavy generation runs on this NVIDIA-class box. For OpenAI-compatible clients, set `base_url` to `https://<your-entrance-host>/v1` with the API key — see the upstream speech-platform guide.

    ## REQUIREMENTS

    - **NVIDIA mode:** amd64 node + driver ≥ 4 GB VRAM (8 GB+ recommended; large optional engines need 12–16 GB).
    - **CPU mode:** 8 GB+ RAM free.
    - **Disk:** ~10 GB floor for data; model weights land in the shared cache (tens of GB as you install more engines).
    - First boot is slower (model download + engine warmup); long jobs (dubbing, audiobook render) are unaffected by request timeouts — the chart disables the entrance proxy timeout for this app.

    ## LINKS

    - Upstream: https://github.com/debpalash/VoiceStudio (AGPL-3.0)
    - Docs: https://github.com/debpalash/VoiceStudio/tree/main/docs
    - Website: https://voicestudio.sh

  upgradeDescription: |
    Ground-up chart rebuild.

    - Upstream backend/image **0.5.6**: Electron-era web server; MCP at `/mcp/` and `/mcp`; OpenAI-compatible `/v1` now returns OpenAI-format errors; MP3 `response_format` fixed; long-audiobook chapters finish on 8 GB GPUs and survive power-off.
    - Full market metadata (description, screenshots, categories, license, docs).
    - Entrance is **public** so native desktop apps can sync from outside Olares without a login wall; app-level API-key auth still covers every rule.
    - GPU slice control: 6 Gi floor / 16 Gi cap via HAMi, keep-warm CPU mode fallback.
    - Probes hardened (in-container curl, immune to sidecar auth flaps), `HOME` fixed for uid 1000 (torch.compile now works), cuDNN 8 side-load for WhisperX/Faster-Whisper included.
    - Install-time choice of `nvidia` or `cpu` accelerator mode.
  developer: debpalash
  website: https://voicestudio.sh
  sourceCode: https://github.com/debpalash/VoiceStudio
  submitter: abidals
  locale:
  - en-US
  - zh-CN
  doc: https://github.com/debpalash/VoiceStudio/tree/main/docs
  license:
  - text: AGPL-3.0
    url: https://github.com/debpalash/VoiceStudio/blob/main/LICENSE
  accelerator:
  - mode: cpu
    requiredCpu: "2"
    limitedCpu: "8"
    requiredMemory: 6Gi
    limitedMemory: 32Gi
    requiredDisk: 10Gi
    limitedDisk: 50Gi
  - mode: nvidia
    supportMultiCard: false
    supportMultiNodes: false
    requiredCpu: "2"
    limitedCpu: "8"
    requiredMemory: 6Gi
    limitedMemory: 32Gi
    requiredDisk: 10Gi
    limitedDisk: 50Gi
    requiredGPUMemory: 6Gi
    limitedGPUMemory: 16Gi
  runAsInternal: false
  runAsUser: true
  supportArch:
  - amd64
  supportClient: {}
options:
  apiTimeout: 0
  allowedOutboundPorts:
  - 80
  - 443
  appScope: {}
  dependencies:
  - mandatory: false
    name: olares
    selfRely: false
    type: system
    version: '>=1.12.6-0'
  oidc: {}
  resetCookie: {}
  shared: false
  upload: {}
  websocket: {}
overlayGateway:
  enable: false
tailscale: {}
workloadReplicas:
  voicestudio: 1