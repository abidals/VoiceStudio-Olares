apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: voicestudio
    olares.service.type: Entrance
  name: voicestudio
  namespace: '{{ .Release.Namespace }}'
  annotations:
    applications.app.bytetrade.io/gpu-inject: "true"
spec:
  replicas: {{ .Values.workloads.voicestudio.replicaCount }}
  selector:
    matchLabels:
      io.kompose.service: voicestudio
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: voicestudio
        olares.service.type: Entrance
    spec:
      enableServiceLinks: false
      initContainers:
      - name: init-permissions
        image: beclab/aboveos-busybox:1.37.0
        command:
        - sh
        - -c
        - |
          COMMON={{ .Values.userspace.appCommon }}
          for d in "$COMMON" "$COMMON/huggingface" "$COMMON/huggingface/xet" "$COMMON/huggingface/hub"; do
            mkdir -p "$d" && chown 1000:1000 "$d"
          done
          mkdir -p /app/omnivoice_data/huggingface /app/omnivoice_data/cudnn8
          chown 1000:1000 "$COMMON" "$COMMON/huggingface" /app/omnivoice_data /app/omnivoice_data/huggingface /app/omnivoice_data/cudnn8
        securityContext:
          runAsUser: 0
        volumeMounts:
        - name: app-data
          mountPath: /app/omnivoice_data
        - name: common
          mountPath: {{ .Values.userspace.appCommon }}
      - name: init-cudnn8
        image: palashdeb/omnivoice-studio:0.5.6
        command:
        - sh
        - -c
        - |
          [ -d /app/omnivoice_data/cudnn8/nvidia/cudnn/lib ] && { echo "cudnn8 compat already present"; exit 0; }
          python3 -m pip install --no-cache-dir --no-deps --target /app/omnivoice_data/cudnn8 "nvidia-cudnn-cu12==8.9.7.29"
        env:
        - name: HOME
          value: /tmp
        - name: PIP_BREAK_SYSTEM_PACKAGES
          value: "1"
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
        volumeMounts:
        - name: app-data
          mountPath: /app/omnivoice_data
      containers:
      - name: voicestudio
        image: palashdeb/omnivoice-studio:0.5.6
        env:
        - name: HF_HOME
          value: "{{ .Values.userspace.appCommon }}/huggingface"
        - name: OMNIVOICE_DATA_DIR
          value: /app/omnivoice_data
        - name: OMNIVOICE_BIND_HOST
          value: 0.0.0.0
        - name: OMNIVOICE_SERVER_MODE
          value: "1"
        - name: HOME
          value: /tmp
        - name: LOGNAME
          value: voicestudio
        - name: USER
          value: voicestudio
        - name: LNAME
          value: voicestudio
        - name: USERNAME
          value: voicestudio
        - name: LD_LIBRARY_PATH
          value: /app/omnivoice_data/cudnn8/nvidia/cudnn/lib:/opt/conda/lib:/usr/local/lib:/usr/lib/x86_64-linux-gnu
        - name: OMNIVOICE_API_KEY
          valueFrom:
            secretKeyRef:
              name: {{ .Release.Name }}-voicestudio
              key: OMNIVOICE_API_KEY
        {{- if .Values.olaresEnv.HF_ENDPOINT }}
        - name: HF_ENDPOINT
          value: "{{ .Values.olaresEnv.HF_ENDPOINT }}"
        {{- end }}
        {{- if .Values.olaresEnv.HF_TOKEN }}
        - name: HF_TOKEN
          value: "{{ .Values.olaresEnv.HF_TOKEN }}"
        {{- end }}
        {{- if .Values.domain.voicestudio }}
        - name: OMNIVOICE_ALLOWED_ORIGINS
          value: "https://{{ .Values.domain.voicestudio }},http://{{ .Values.domain.voicestudio }}"
        {{- end }}
        ports:
        - containerPort: 3900
          protocol: TCP
        readinessProbe:
          exec:
            command:
            - curl
            - -fsS
            - http://127.0.0.1:3900/health
          initialDelaySeconds: 15
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 40
        livenessProbe:
          exec:
            command:
            - curl
            - -fsS
            - http://127.0.0.1:3900/health
          initialDelaySeconds: 90
          periodSeconds: 30
          timeoutSeconds: 10
          failureThreshold: 24
        resources:
          requests:
            cpu: "2"
            memory: 6Gi
          limits:
            cpu: "8"
            memory: 32Gi
        volumeMounts:
        - name: app-data
          mountPath: /app/omnivoice_data
        - name: common
          mountPath: {{ .Values.userspace.appCommon }}
      restartPolicy: Always
      volumes:
      - name: app-data
        hostPath:
          path: {{ .Values.userspace.appData }}
          type: DirectoryOrCreate
      - name: common
        hostPath:
          path: {{ .Values.userspace.appCommon }}
          type: DirectoryOrCreate